<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 배달온도</title>
    <link rel="icon" href="/images/baedal-ondo-icon.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            padding: 32px;
            background: #fff;
            border: 1px solid #dde2e7;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 24px;
            font-size: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #cbd3dc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 8px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <main class="login-container">
        <h1>로그인</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="userId">ID</label>
                <input type="text" id="userId" name="userId" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">PW</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit">로그인</button>
        </form>
    </main>
</body>
</html>
