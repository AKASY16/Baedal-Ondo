name: Publish Docker Image

on:
  workflow_run:
    workflows:
      - "Github CI Workflow"
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'

    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/akasy16/baedal-ondo

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build application jar
        run: ./gradlew bootJar

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.event.workflow_run.head_sha }}" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.event.workflow_run.head_sha }}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: OIDC subject 확인
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          python3 - "$TOKEN" <<'PY'
          import sys
          import json
          import base64

          token = sys.argv[1]

          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          print("ref:", claims.get("ref"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("event_name:", claims.get("event_name"))
          print("workflow_ref:", claims.get("workflow_ref"))
          PY

      - name: 신규 OIDC 역할 수임 테스트
        env:
          ROLE_ARN: arn:aws:iam::621093248464:role/BaedalOndoOidcProbeRole
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name github-oidc-test \
            --web-identity-token "$TOKEN" \
            --duration-seconds 900 \
            --query 'AssumedRoleUser.Arn' \
            --output text