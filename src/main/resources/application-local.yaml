# 로컬 개발용 설정.
#
# SPRING_PROFILES_ACTIVE=local 로 실행할 때만 적용된다.
# 서버에서는 이 프로필을 켜지 않으므로 운영에는 SQL 로그가 남지 않는다.
#
# 비밀값은 두지 않는다. 이 파일은 저장소에 올라간다.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # 실행된 SQL
    org.hibernate.SQL: debug
    # 물음표 자리에 들어간 실제 파라미터. 이게 없으면 쿼리를 봐도 값을 알 수 없다.
    org.hibernate.orm.jdbc.bind: trace
