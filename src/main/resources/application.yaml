server:
  forward-headers-strategy: native

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/baedalondo}"
    username: "${DB_USERNAME:baedalondo_app}"
    password: "${DB_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: validate

  # 템플릿을 다 만든 뒤에 한 번에 내보낸다.
  # 기본값(true)이면 Thymeleaf가 렌더하면서 바로 흘려보내는데, 페이지가 톰캣 응답 버퍼(8KB)를
  # 넘으면 그 지점에서 응답이 커밋된다. 그 뒤에 나오는 th:action이 CSRF 토큰을 넣으려고
  # 세션을 만들려다 "Cannot create a session after the response has been committed"로 터진다.
  # 세션이 이미 있는 사용자는 멀쩡하고 첫 방문자만 페이지가 잘려, 개발 중에는 잘 드러나지 않는다.
  thymeleaf:
    servlet:
      produce-partial-output-while-processing: false

# SQL 로깅은 여기 두지 않는다. 이 파일의 값이 곧 운영 설정이라 켜 두면 서버에도 그대로 적용된다.
# 로컬에서 쿼리를 보려면 SPRING_PROFILES_ACTIVE=local 로 실행한다. application-local.yaml 참고.

# 배포 후 Nginx와 운영자가 기동 여부를 확인하는 용도로 health만 연다.
# 상세 정보에는 DB 접속 상태 등이 포함되므로 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 서버가 뜨면 공휴일, 대기질, 예보를 한 번 채운다.
# 스케줄러 첫 실행까지 캐시가 비어 있는 구간을 없앤다. 실패해도 기동은 계속한다.
baedalondo:
  startup-preload:
    enabled: "${STARTUP_PRELOAD_ENABLED:true}"
  security:
    # remember-me 토큰 서명 키는 소스나 이미지에 포함하지 않고 환경변수로만 받는다.
    remember-me-key: "${REMEMBER_ME_KEY}"
  # 로그인과 회원가입 시도 제한.
  # 정상 사용자는 평생 닿지 않는 값으로 두고 자동화된 반복만 걸리게 한다.
  # 실제 공격 양상을 보고 조정하는 값이라 재배포 없이 환경변수로 덮을 수 있게 뒀다.
  login-protection:
    max-attempts-per-address: "${LOGIN_MAX_ATTEMPTS_PER_ADDRESS:10}"
    attempt-window: "${LOGIN_ATTEMPT_WINDOW:1m}"
    max-failures-per-account: "${LOGIN_MAX_FAILURES_PER_ACCOUNT:5}"
    account-lock: "${LOGIN_ACCOUNT_LOCK:10m}"

service:
  legal:
    operator-name: "${SERVICE_OPERATOR_NAME:배달온도 운영자}"
    contact-email: "${SERVICE_CONTACT_EMAIL:baedalondo@gmail.com}"

# 외부 API 키는 환경변수로만 주입한다.
# 설정 파일에 두면 빌드 산출물(jar)과 컨테이너 이미지에 그대로 포장되어 배포된다.
kma:
  api:
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
    auth-key: "${KMA_AUTH_KEY}"

dataportal:
  api:
    base-url: https://apis.data.go.kr/B552584/ArpltnInforInqireSvc
    air-quality-stats-base-url: https://apis.data.go.kr/B552584/ArpltnStatsSvc
    holiday-base-url: https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
    auth-key: "${DATAPORTAL_AUTH_KEY}"
    # 공휴일 키를 따로 발급받지 않았다면 공공데이터포털 공용 키를 그대로 쓴다.
    holiday-auth-key: "${DATAPORTAL_HOLIDAY_AUTH_KEY:${DATAPORTAL_AUTH_KEY}}"

jusogokr:
  api:
    search-auth-key: "${JUSO_SEARCH_AUTH_KEY}"
    coordinate-auth-key: "${JUSO_COORDINATE_AUTH_KEY}"
    popup-auth-key: "${JUSO_POPUP_AUTH_KEY:TESTJUSOGOKR}"
