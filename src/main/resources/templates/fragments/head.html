<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<!--/*
  페이지마다 head를 따로 들고 있어서 favicon이 약관·처리방침에만 빠져 있었고 제목 구분자도 갈렸다.
  공유 메타를 넣으려면 같은 열다섯 줄을 다섯 번 복붙해야 해서, 모든 페이지가 공통으로 쓰는 부분만 여기 모은다.
  페이지 전용 stylesheet와 <style>은 각 페이지가 자기 head에 계속 둔다.

  shareTitle을 title과 따로 받는 이유: 카카오톡·슬랙에 링크를 붙였을 때 "로그인"이라고만 뜨면
  이 서비스가 뭔지 알 수 없다. 탭 제목과 공유 카드 제목은 목적이 다르다.
*/-->
<th:block th:fragment="meta(pageTitle, shareTitle, description, path, indexable)"
          th:with="baseUrl='https://www.baedalondo.com', imageUrl='https://www.baedalondo.com/images/og-image.png'">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' - 배달온도'">배달온도</title>
    <meta name="description" th:content="${description}">

    <!--/* apex와 www가 둘 다 200을 주므로, 어느 쪽으로 들어와도 같은 주소를 가리키게 한다.
           엣지의 apex -> www 리다이렉트가 붙기 전까지는 이 태그가 중복 색인을 막는 유일한 수단이다. */-->
    <link rel="canonical" th:href="${baseUrl} + ${path}">

    <meta name="robots" th:content="${indexable} ? 'index, follow' : 'noindex, nofollow'">
    <meta name="theme-color" content="#f1efe9">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="배달온도">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${baseUrl} + ${path}">
    <meta property="og:image" th:content="${imageUrl}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="배달온도 — 오늘 장사, 감 말고 온도로.">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${shareTitle}">
    <meta name="twitter:description" th:content="${description}">
    <meta name="twitter:image" th:content="${imageUrl}">

    <link rel="icon" href="/images/baedal-ondo-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/common.css">
</th:block>
</head>
</html>
