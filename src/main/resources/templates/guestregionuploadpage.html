<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuestRegion Upload</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --line: #d8dee8;
            --text: #1f2937;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #b42318;
            --success: #067647;
            --code-bg: #111827;
            --code-text: #d1fae5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        .page {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 28px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 26px;
            line-height: 1.25;
        }

        .description {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.6;
        }

        .panel {
            margin-bottom: 18px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 14px;
        }

        .panel h2 {
            margin: 0;
            font-size: 18px;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 150px 150px auto;
            gap: 10px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            letter-spacing: 0;
        }

        input[readonly] {
            background: #f9fafb;
        }

        button {
            min-height: 38px;
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: #ffffff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            cursor: not-allowed;
            background: #98a2b3;
        }

        .secondary {
            background: #475467;
        }

        .secondary:hover {
            background: #344054;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .wide {
            grid-column: 1 / -1;
        }

        .status {
            min-height: 22px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .status.success {
            color: var(--success);
            font-weight: 800;
        }

        .status.error {
            color: var(--danger);
            font-weight: 800;
        }

        pre {
            min-height: 180px;
            margin: 0;
            overflow: auto;
            padding: 14px;
            border-radius: 8px;
            background: var(--code-bg);
            color: var(--code-text);
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .popup-message {
            display: none;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .popup-message strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        @media (max-width: 820px) {
            .page {
                padding: 20px;
            }

            .controls,
            .grid {
                grid-template-columns: 1fr;
            }

            .panel-header {
                align-items: stretch;
                flex-direction: column;
            }

            .wide {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
<form id="juso-popup-form" method="post" style="display: none;">
    <input type="hidden" id="popup-confmKey" name="confmKey">
    <input type="hidden" id="popup-returnUrl" name="returnUrl">
    <input type="hidden" id="popup-resultType" name="resultType">
    <input type="hidden" id="popup-useDetailAddr" name="useDetailAddr">
</form>

<div id="callback-values" style="display: none;">
    <input id="callback-inputYn" th:value="${param.inputYn != null ? param.inputYn[0] : ''}">
    <input id="callback-roadFullAddr" th:value="${param.roadFullAddr != null ? param.roadFullAddr[0] : ''}">
    <input id="callback-roadAddrPart1" th:value="${param.roadAddrPart1 != null ? param.roadAddrPart1[0] : ''}">
    <input id="callback-roadAddrPart2" th:value="${param.roadAddrPart2 != null ? param.roadAddrPart2[0] : ''}">
    <input id="callback-jibunAddr" th:value="${param.jibunAddr != null ? param.jibunAddr[0] : ''}">
    <input id="callback-zipNo" th:value="${param.zipNo != null ? param.zipNo[0] : ''}">
    <input id="callback-addrDetail" th:value="${param.addrDetail != null ? param.addrDetail[0] : ''}">
    <input id="callback-admCd" th:value="${param.admCd != null ? param.admCd[0] : ''}">
    <input id="callback-rnMgtSn" th:value="${param.rnMgtSn != null ? param.rnMgtSn[0] : ''}">
    <input id="callback-bdMgtSn" th:value="${param.bdMgtSn != null ? param.bdMgtSn[0] : ''}">
    <input id="callback-siNm" th:value="${param.siNm != null ? param.siNm[0] : ''}">
    <input id="callback-sggNm" th:value="${param.sggNm != null ? param.sggNm[0] : ''}">
    <input id="callback-emdNm" th:value="${param.emdNm != null ? param.emdNm[0] : ''}">
    <input id="callback-rn" th:value="${param.rn != null ? param.rn[0] : ''}">
    <input id="callback-udrtYn" th:value="${param.udrtYn != null ? param.udrtYn[0] : ''}">
    <input id="callback-buldMnnm" th:value="${param.buldMnnm != null ? param.buldMnnm[0] : ''}">
    <input id="callback-buldSlno" th:value="${param.buldSlno != null ? param.buldSlno[0] : ''}">
</div>

<div id="popup-message" class="popup-message">
    <div>
        <strong>주소 검색 팝업을 준비하고 있습니다.</strong>
        <span>잠시 후 도로명주소 검색 화면으로 이동합니다.</span>
    </div>
</div>

<main id="page" class="page">
    <h1>GuestRegion Upload</h1>
    <p class="description">
        Juso 주소검색 결과를 GUEST_REGION 컬럼에 맞게 매핑하고, 서버의 주소 좌표 변환 메서드로 nx, ny를 계산해 저장합니다.
    </p>

    <section class="panel">
        <h2>주소 검색</h2>
        <div class="controls">
            <label>
                Juso 승인키
                <input id="confmKey" th:value="${jusoPopupAuthKey}" autocomplete="off">
            </label>
            <label>
                결과 유형
                <select id="resultType">
                    <option value="4" selected>도로명+지번+상세건물명</option>
                    <option value="3">도로명+상세건물명</option>
                    <option value="2">도로명+지번</option>
                    <option value="1">도로명</option>
                </select>
            </label>
            <label>
                상세주소
                <select id="useDetailAddr">
                    <option value="Y" selected>Y</option>
                    <option value="N">N</option>
                </select>
            </label>
            <button type="button" onclick="goJusoPopup()">주소 검색</button>
        </div>
        <p id="status" class="status">주소를 검색하면 아래에 GUEST_REGION 매핑값이 채워집니다.</p>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>GUEST_REGION 매핑값</h2>
            <button id="save-button" type="button" onclick="saveGuestRegion()" disabled>GUEST_REGION 등록</button>
        </div>
        <div class="grid">
            <label>
                ID
                <input id="guest-id" readonly>
            </label>
            <label>
                ACTIVE
                <input id="guest-active" readonly>
            </label>
            <label class="wide">
                ADDRESS
                <input id="guest-address" readonly>
            </label>
            <label class="wide">
                ROAD_ADDRESS
                <input id="guest-roadAddress" readonly>
            </label>
            <label class="wide">
                JIBUN_ADDRESS
                <input id="guest-jibunAddress" readonly>
            </label>
            <label class="wide">
                ADDRESS_DETAIL
                <input id="guest-addressDetail">
            </label>
            <label>
                POSTAL_CODE
                <input id="guest-postalCode" readonly>
            </label>
            <label>
                SIDO_NAME
                <input id="guest-sidoName" readonly>
            </label>
            <label>
                SIGUNGU_NAME
                <input id="guest-sigunguName" readonly>
            </label>
            <label>
                DONG_NAME
                <input id="guest-dongName" readonly>
            </label>
            <label>
                ADDRESS_REGION_CODE
                <input id="guest-addressRegionCode" readonly>
            </label>
            <label>
                ROAD_NAME_CODE
                <input id="guest-roadNameCode" readonly>
            </label>
            <label>
                BUILDING_MANAGEMENT_NUMBER
                <input id="guest-buildingManagementNumber" readonly>
            </label>
            <label>
                ROAD_NAME
                <input id="guest-roadName" readonly>
            </label>
            <label>
                UNDERGROUND_YN
                <input id="guest-undergroundYn" readonly>
            </label>
            <label>
                BUILDING_MAIN_NUMBER
                <input id="guest-buildingMainNumber" readonly>
            </label>
            <label>
                BUILDING_SUB_NUMBER
                <input id="guest-buildingSubNumber" readonly>
            </label>
            <label>
                NX
                <input id="guest-nx" readonly>
            </label>
            <label>
                NY
                <input id="guest-ny" readonly>
            </label>
            <label class="wide">
                CREATED_AT
                <input id="guest-createdAt" readonly>
            </label>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>요청/응답 데이터</h2>
            <button class="secondary" type="button" onclick="clearPage()">초기화</button>
        </div>
        <pre id="raw-output">{}</pre>
    </section>
</main>

<script th:inline="javascript">
    const defaultJusoPopupAuthKey = /*[[${jusoPopupAuthKey}]]*/ "TESTJUSOGOKR";
    let currentJusoResult = null;

    const callbackFieldNames = [
        "roadFullAddr",
        "roadAddrPart1",
        "roadAddrPart2",
        "jibunAddr",
        "zipNo",
        "addrDetail",
        "admCd",
        "rnMgtSn",
        "bdMgtSn",
        "siNm",
        "sggNm",
        "emdNm",
        "rn",
        "udrtYn",
        "buldMnnm",
        "buldSlno"
    ];

    const guestFieldIds = [
        "id",
        "address",
        "roadAddress",
        "jibunAddress",
        "addressDetail",
        "postalCode",
        "sidoName",
        "sigunguName",
        "dongName",
        "addressRegionCode",
        "roadNameCode",
        "buildingManagementNumber",
        "roadName",
        "undergroundYn",
        "buildingMainNumber",
        "buildingSubNumber",
        "nx",
        "ny",
        "active",
        "createdAt"
    ];

    document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);

        if (params.get("popup") === "Y") {
            runPopupBridge(params);
            return;
        }

        window.jusoCallBack = receiveJusoResult;
    });

    function goJusoPopup() {
        const confmKey = document.getElementById("confmKey").value.trim() || defaultJusoPopupAuthKey;
        const resultType = document.getElementById("resultType").value;
        const useDetailAddr = document.getElementById("useDetailAddr").value;
        const url = "/guestregionuploadpage?popup=Y"
            + "&confmKey=" + encodeURIComponent(confmKey)
            + "&resultType=" + encodeURIComponent(resultType)
            + "&useDetailAddr=" + encodeURIComponent(useDetailAddr);

        window.open(url, "jusoPopup", "width=570,height=620,scrollbars=yes,resizable=yes");
    }

    function runPopupBridge(params) {
        document.getElementById("page").style.display = "none";
        document.getElementById("popup-message").style.display = "grid";

        const inputYn = readCallbackValue("inputYn");

        if (inputYn === "Y") {
            const result = readCallbackResult();

            if (window.opener && !window.opener.closed && typeof window.opener.jusoCallBack === "function") {
                window.opener.jusoCallBack(result);
                window.close();
                return;
            }

            document.getElementById("popup-message").innerHTML =
                "<div><strong>부모 창을 찾을 수 없습니다.</strong><pre>"
                + escapeHtml(JSON.stringify(result, null, 2))
                + "</pre></div>";
            return;
        }

        const form = document.getElementById("juso-popup-form");
        document.getElementById("popup-confmKey").value = params.get("confmKey") || defaultJusoPopupAuthKey;
        document.getElementById("popup-returnUrl").value = window.location.origin + window.location.pathname + "?popup=Y";
        document.getElementById("popup-resultType").value = params.get("resultType") || "4";
        document.getElementById("popup-useDetailAddr").value = params.get("useDetailAddr") || "Y";
        form.action = "https://business.juso.go.kr/addrlink/addrLinkUrl.do";
        form.submit();
    }

    function readCallbackResult() {
        const result = {};

        callbackFieldNames.forEach(function (name) {
            result[name] = readCallbackValue(name);
        });

        return result;
    }

    function readCallbackValue(name) {
        const input = document.getElementById("callback-" + name);
        return input ? input.value : "";
    }

    function receiveJusoResult(result) {
        currentJusoResult = result;
        const mapped = mapJusoToGuestRegion(result);

        fillGuestRegionFields(mapped);
        setStatus("주소 검색 결과를 GUEST_REGION 컬럼에 매핑했습니다. 등록하면 서버에서 nx, ny를 계산해 저장합니다.", "success");
        document.getElementById("save-button").disabled = false;
        writeRawOutput({
            guestRegionMapping: mapped,
            jusoResult: result
        });
    }

    function mapJusoToGuestRegion(result) {
        return {
            id: "",
            address: result.roadFullAddr || result.roadAddrPart1 || "",
            roadAddress: result.roadAddrPart1 || "",
            jibunAddress: result.jibunAddr || "",
            addressDetail: result.addrDetail || "",
            postalCode: result.zipNo || "",
            sidoName: result.siNm || "",
            sigunguName: result.sggNm || "",
            dongName: result.emdNm || "",
            addressRegionCode: result.admCd || "",
            roadNameCode: result.rnMgtSn || "",
            buildingManagementNumber: result.bdMgtSn || "",
            roadName: result.rn || "",
            undergroundYn: result.udrtYn || "",
            buildingMainNumber: result.buldMnnm || "",
            buildingSubNumber: result.buldSlno || "",
            nx: "",
            ny: "",
            active: "",
            createdAt: ""
        };
    }

    async function saveGuestRegion() {
        if (!currentJusoResult) {
            setStatus("먼저 주소를 검색해야 합니다.", "error");
            return;
        }

        currentJusoResult.addrDetail = document.getElementById("guest-addressDetail").value;
        const payload = {jusoAddress: currentJusoResult};
        document.getElementById("save-button").disabled = true;
        setStatus("좌표 변환 후 GUEST_REGION에 저장하는 중입니다.", "");

        try {
            const response = await fetch("/api/guest-regions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const text = await response.text();
            const body = text ? JSON.parse(text) : {};

            if (!response.ok) {
                throw new Error(body.message || text || "GUEST_REGION 저장에 실패했습니다.");
            }

            fillGuestRegionFields(body);
            setStatus("GUEST_REGION에 저장했습니다. ID: " + body.id, "success");
            writeRawOutput({
                request: payload,
                response: body
            });
        } catch (error) {
            document.getElementById("save-button").disabled = false;
            setStatus(error.message, "error");
            writeRawOutput({
                request: payload,
                error: error.message
            });
        }
    }

    function fillGuestRegionFields(data) {
        guestFieldIds.forEach(function (name) {
            setValue("guest-" + name, data[name]);
        });
    }

    function clearPage() {
        currentJusoResult = null;
        fillGuestRegionFields({});
        document.getElementById("save-button").disabled = true;
        setStatus("주소를 검색하면 아래에 GUEST_REGION 매핑값이 채워집니다.", "");
        writeRawOutput({});
    }

    function setValue(id, value) {
        document.getElementById(id).value = value === null || value === undefined ? "" : value;
    }

    function setStatus(message, type) {
        const status = document.getElementById("status");
        status.textContent = message;
        status.className = "status" + (type ? " " + type : "");
    }

    function writeRawOutput(value) {
        document.getElementById("raw-output").textContent = JSON.stringify(value, null, 2);
    }

    function escapeHtml(value) {
        return value
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
