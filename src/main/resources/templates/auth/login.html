<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 배달온도</title>
    <link rel="icon" href="/images/baedal-ondo-icon.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: grid;
            justify-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 800;
            color: #ff6b35;
            text-align: center;
        }

        .logo img {
            width: 48px;
            height: 48px;
        }

        .subtitle {
            margin-bottom: 28px;
            font-size: 14px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff6b35;
        }

        .login-button {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #ff6b35;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:hover {
            background: #f25f2a;
        }

        .guest-button {
            display: block;
            width: 100%;
            height: 46px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #ffffff;
            color: #333;
            font-size: 15px;
            font-weight: 800;
            line-height: 44px;
            text-align: center;
            text-decoration: none;
        }

        .guest-button:hover {
            border-color: #ff6b35;
            color: #ff6b35;
        }

        .helper {
            margin-top: 18px;
            font-size: 13px;
            color: #777;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="page">
    <div class="login-card">
        <div class="logo">
            <img src="/images/baedal-ondo-icon.svg" alt="">
            <span>배달온도</span>
        </div>
        <div class="subtitle">
            사장님의 오늘 배달 수요를<br>
            한눈에 확인하세요
        </div>

        <form action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label for="loginId">로그인 ID</label>
                <input type="text" id="loginId" name="loginId" placeholder="owner">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="login-button">로그인</button>
        </form>
        <a class="guest-button" href="/guest">게스트 모드로 보기</a>

        <div class="helper">
            아직 로그인 기능은 구현 전입니다.
        </div>
    </div>
</div>
</body>
</html>
