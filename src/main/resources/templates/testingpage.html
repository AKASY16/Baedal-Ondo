<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소 검색 테스트 - 배달온도</title>
    <link rel="icon" href="/images/beadal-ondo-icon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --line: #d7dde5;
            --text: #1f2937;
            --muted: #667085;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --code-bg: #111827;
            --code-text: #d1fae5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        .page {
            width: min(1040px, 100%);
            margin: 0 auto;
            padding: 28px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 26px;
            line-height: 1.25;
        }

        .description {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.6;
        }

        .panel {
            margin-bottom: 18px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
        }

        .panel h2 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 160px 160px auto;
            gap: 10px;
            align-items: end;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            letter-spacing: 0;
        }

        input[readonly] {
            background: #f9fafb;
        }

        button {
            min-height: 38px;
            padding: 8px 14px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: #ffffff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .wide {
            grid-column: 1 / -1;
        }

        .note {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
        }

        pre {
            min-height: 180px;
            margin: 0;
            overflow: auto;
            padding: 14px;
            border-radius: 8px;
            background: var(--code-bg);
            color: var(--code-text);
            font-size: 13px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .popup-message {
            display: none;
            min-height: 100vh;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .popup-message strong {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
        }

        @media (max-width: 820px) {
            .page {
                padding: 20px;
            }

            .controls,
            .grid {
                grid-template-columns: 1fr;
            }

            .wide {
                grid-column: auto;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<form id="juso-popup-form" method="post" style="display: none;">
    <input type="hidden" id="popup-confmKey" name="confmKey">
    <input type="hidden" id="popup-returnUrl" name="returnUrl">
    <input type="hidden" id="popup-resultType" name="resultType">
    <input type="hidden" id="popup-useDetailAddr" name="useDetailAddr">
</form>

<div id="callback-values" style="display: none;">
    <input id="callback-inputYn" th:value="${param.inputYn != null ? param.inputYn[0] : ''}">
    <input id="callback-roadFullAddr" th:value="${param.roadFullAddr != null ? param.roadFullAddr[0] : ''}">
    <input id="callback-roadAddrPart1" th:value="${param.roadAddrPart1 != null ? param.roadAddrPart1[0] : ''}">
    <input id="callback-roadAddrPart2" th:value="${param.roadAddrPart2 != null ? param.roadAddrPart2[0] : ''}">
    <input id="callback-jibunAddr" th:value="${param.jibunAddr != null ? param.jibunAddr[0] : ''}">
    <input id="callback-engAddr" th:value="${param.engAddr != null ? param.engAddr[0] : ''}">
    <input id="callback-zipNo" th:value="${param.zipNo != null ? param.zipNo[0] : ''}">
    <input id="callback-addrDetail" th:value="${param.addrDetail != null ? param.addrDetail[0] : ''}">
    <input id="callback-admCd" th:value="${param.admCd != null ? param.admCd[0] : ''}">
    <input id="callback-rnMgtSn" th:value="${param.rnMgtSn != null ? param.rnMgtSn[0] : ''}">
    <input id="callback-bdMgtSn" th:value="${param.bdMgtSn != null ? param.bdMgtSn[0] : ''}">
    <input id="callback-detBdNmList" th:value="${param.detBdNmList != null ? param.detBdNmList[0] : ''}">
    <input id="callback-bdNm" th:value="${param.bdNm != null ? param.bdNm[0] : ''}">
    <input id="callback-bdKdcd" th:value="${param.bdKdcd != null ? param.bdKdcd[0] : ''}">
    <input id="callback-siNm" th:value="${param.siNm != null ? param.siNm[0] : ''}">
    <input id="callback-sggNm" th:value="${param.sggNm != null ? param.sggNm[0] : ''}">
    <input id="callback-emdNm" th:value="${param.emdNm != null ? param.emdNm[0] : ''}">
    <input id="callback-liNm" th:value="${param.liNm != null ? param.liNm[0] : ''}">
    <input id="callback-rn" th:value="${param.rn != null ? param.rn[0] : ''}">
    <input id="callback-udrtYn" th:value="${param.udrtYn != null ? param.udrtYn[0] : ''}">
    <input id="callback-buldMnnm" th:value="${param.buldMnnm != null ? param.buldMnnm[0] : ''}">
    <input id="callback-buldSlno" th:value="${param.buldSlno != null ? param.buldSlno[0] : ''}">
    <input id="callback-mtYn" th:value="${param.mtYn != null ? param.mtYn[0] : ''}">
    <input id="callback-lnbrMnnm" th:value="${param.lnbrMnnm != null ? param.lnbrMnnm[0] : ''}">
    <input id="callback-lnbrSlno" th:value="${param.lnbrSlno != null ? param.lnbrSlno[0] : ''}">
    <input id="callback-emdNo" th:value="${param.emdNo != null ? param.emdNo[0] : ''}">
</div>

<div id="popup-message" class="popup-message">
    <div>
        <strong>주소 검색 팝업을 준비 중입니다.</strong>
        <span>잠시 후 도로명주소 검색 화면으로 이동합니다.</span>
    </div>
</div>

<main id="page" class="page">
    <h1>도로명주소 팝업 API 테스트</h1>
    <p class="description">
        도로명주소 팝업 API 결과를 현재 Store 테이블 구조에 맞춰 채우는 테스트 페이지입니다.
        실제 저장은 하지 않고, 콜백 데이터와 Store 매핑 결과만 확인합니다.
    </p>

    <section class="panel">
        <h2>API 호출</h2>
        <div class="controls">
            <label>
                승인키
                <input id="confmKey" th:value="${jusoPopupAuthKey}" autocomplete="off">
            </label>
            <label>
                결과 유형
                <select id="resultType">
                    <option value="4" selected>도로명+지번+상세건물명</option>
                    <option value="3">도로명+상세건물명</option>
                    <option value="2">도로명+지번</option>
                    <option value="1">도로명</option>
                </select>
            </label>
            <label>
                상세주소 제공
                <select id="useDetailAddr">
                    <option value="Y" selected>Y</option>
                    <option value="N">N</option>
                </select>
            </label>
            <button type="button" onclick="goJusoPopup()">주소검색</button>
        </div>
        <p class="note">
            application-secret.yaml의 jusogokr.api.popup-auth-key 값을 기본으로 넣습니다.
            다른 승인키로 테스트하려면 이 입력값만 바꿔 실행하면 됩니다.
        </p>
    </section>

    <section class="panel">
        <h2>Store 매핑 결과</h2>
        <div class="grid">
            <label>
                ID
                <input id="store-id" readonly>
            </label>
            <label>
                NAME
                <input id="store-name" placeholder="테스트 가게명">
            </label>
            <label>
                BUSINESS_TYPE
                <select id="store-businessType">
                    <option value="">업종을 선택하세요</option>
                    <option value="KOREAN_FOOD">한식</option>
                    <option value="CHINESE_FOOD">중식</option>
                    <option value="JAPANESE_FOOD">일식</option>
                    <option value="WESTERN_FOOD">양식</option>
                    <option value="CHICKEN">치킨</option>
                    <option value="FAST_FOOD">패스트푸드</option>
                    <option value="BUNSIK">분식</option>
                    <option value="CAFE_BEVERAGE">카페·음료</option>
                    <option value="BAKERY">제과·베이커리</option>
                </select>
            </label>
            <label>
                POSTAL_CODE
                <input id="store-postalCode" readonly>
            </label>
            <label class="wide">
                ADDRESS
                <input id="store-address" readonly>
            </label>
            <label class="wide">
                ROAD_ADDRESS
                <input id="store-roadAddress" readonly>
            </label>
            <label class="wide">
                JIBUN_ADDRESS
                <input id="store-jibunAddress" readonly>
            </label>
            <label class="wide">
                ADDRESS_DETAIL
                <input id="store-addressDetail">
            </label>
            <label>
                SIDO_NAME
                <input id="store-sidoName" readonly>
            </label>
            <label>
                SIGUNGU_NAME
                <input id="store-sigunguName" readonly>
            </label>
            <label>
                DONG_NAME
                <input id="store-dongName" readonly>
            </label>
            <label>
                ADDRESS_REGION_CODE
                <input id="store-addressRegionCode" readonly>
            </label>
            <label>
                ROAD_NAME_CODE
                <input id="store-roadNameCode" readonly>
            </label>
            <label>
                BUILDING_MANAGEMENT_NUMBER
                <input id="store-buildingManagementNumber" readonly>
            </label>
            <label>
                ROAD_NAME
                <input id="store-roadName" readonly>
            </label>
            <label>
                UNDERGROUND_YN
                <input id="store-undergroundYn" readonly>
            </label>
            <label>
                BUILDING_MAIN_NUMBER
                <input id="store-buildingMainNumber" readonly>
            </label>
            <label>
                BUILDING_SUB_NUMBER
                <input id="store-buildingSubNumber" readonly>
            </label>
            <label>
                NX
                <input id="store-nx" placeholder="좌표 API 후처리">
            </label>
            <label>
                NY
                <input id="store-ny" placeholder="좌표 API 후처리">
            </label>
            <label>
                CREATED_AT
                <input id="store-createdAt" readonly>
            </label>
        </div>
    </section>

    <section class="panel">
        <h2>원본 콜백 데이터</h2>
        <pre id="raw-output">{}</pre>
    </section>
</main>

<script th:inline="javascript">
    const defaultJusoPopupAuthKey = /*[[${jusoPopupAuthKey}]]*/ "TESTJUSOGOKR";

    const callbackFieldNames = [
        "roadFullAddr",
        "roadAddrPart1",
        "roadAddrPart2",
        "jibunAddr",
        "engAddr",
        "zipNo",
        "addrDetail",
        "admCd",
        "rnMgtSn",
        "bdMgtSn",
        "detBdNmList",
        "bdNm",
        "bdKdcd",
        "siNm",
        "sggNm",
        "emdNm",
        "liNm",
        "rn",
        "udrtYn",
        "buldMnnm",
        "buldSlno",
        "mtYn",
        "lnbrMnnm",
        "lnbrSlno",
        "emdNo"
    ];

    document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);

        if (params.get("popup") === "Y") {
            runPopupBridge(params);
            return;
        }

        window.jusoCallBack = receiveJusoResult;
    });

    function goJusoPopup() {
        const confmKey = document.getElementById("confmKey").value.trim() || defaultJusoPopupAuthKey;
        const resultType = document.getElementById("resultType").value;
        const useDetailAddr = document.getElementById("useDetailAddr").value;
        const url = "/testingpage?popup=Y"
            + "&confmKey=" + encodeURIComponent(confmKey)
            + "&resultType=" + encodeURIComponent(resultType)
            + "&useDetailAddr=" + encodeURIComponent(useDetailAddr);

        window.open(url, "jusoPopup", "width=570,height=620,scrollbars=yes,resizable=yes");
    }

    function runPopupBridge(params) {
        document.getElementById("page").style.display = "none";
        document.getElementById("popup-message").style.display = "grid";

        const inputYn = readCallbackValue("inputYn");

        if (inputYn === "Y") {
            const result = readCallbackResult();

            if (window.opener && !window.opener.closed && typeof window.opener.jusoCallBack === "function") {
                window.opener.jusoCallBack(result);
                window.close();
                return;
            }

            document.getElementById("popup-message").innerHTML =
                "<div><strong>부모 창을 찾을 수 없습니다.</strong><pre>"
                + escapeHtml(JSON.stringify(result, null, 2))
                + "</pre></div>";
            return;
        }

        const form = document.getElementById("juso-popup-form");
        document.getElementById("popup-confmKey").value = params.get("confmKey") || defaultJusoPopupAuthKey;
        document.getElementById("popup-returnUrl").value = window.location.origin + window.location.pathname + "?popup=Y";
        document.getElementById("popup-resultType").value = params.get("resultType") || "4";
        document.getElementById("popup-useDetailAddr").value = params.get("useDetailAddr") || "Y";
        form.action = "https://business.juso.go.kr/addrlink/addrLinkUrl.do";
        form.submit();
    }

    function readCallbackResult() {
        const result = {};

        callbackFieldNames.forEach(function (name) {
            result[name] = readCallbackValue(name);
        });

        return result;
    }

    function readCallbackValue(name) {
        const input = document.getElementById("callback-" + name);
        return input ? input.value : "";
    }

    function receiveJusoResult(result) {
        const storeData = {
            id: "",
            name: document.getElementById("store-name").value,
            businessType: document.getElementById("store-businessType").value,
            address: result.roadFullAddr || result.roadAddrPart1 || "",
            roadAddress: result.roadAddrPart1 || "",
            jibunAddress: result.jibunAddr || "",
            addressDetail: result.addrDetail || "",
            postalCode: result.zipNo || "",
            sidoName: result.siNm || "",
            sigunguName: result.sggNm || "",
            dongName: result.emdNm || "",
            addressRegionCode: result.admCd || "",
            roadNameCode: result.rnMgtSn || "",
            buildingManagementNumber: result.bdMgtSn || "",
            roadName: result.rn || "",
            undergroundYn: result.udrtYn || "",
            buildingMainNumber: result.buldMnnm || "",
            buildingSubNumber: result.buldSlno || "",
            nx: "",
            ny: "",
            createdAt: ""
        };

        setValue("store-id", storeData.id);
        setValue("store-businessType", storeData.businessType);
        setValue("store-address", storeData.address);
        setValue("store-roadAddress", storeData.roadAddress);
        setValue("store-jibunAddress", storeData.jibunAddress);
        setValue("store-addressDetail", storeData.addressDetail);
        setValue("store-postalCode", storeData.postalCode);
        setValue("store-sidoName", storeData.sidoName);
        setValue("store-sigunguName", storeData.sigunguName);
        setValue("store-dongName", storeData.dongName);
        setValue("store-addressRegionCode", storeData.addressRegionCode);
        setValue("store-roadNameCode", storeData.roadNameCode);
        setValue("store-buildingManagementNumber", storeData.buildingManagementNumber);
        setValue("store-roadName", storeData.roadName);
        setValue("store-undergroundYn", storeData.undergroundYn);
        setValue("store-buildingMainNumber", storeData.buildingMainNumber);
        setValue("store-buildingSubNumber", storeData.buildingSubNumber);
        setValue("store-nx", storeData.nx);
        setValue("store-ny", storeData.ny);
        setValue("store-createdAt", storeData.createdAt);

        document.getElementById("raw-output").textContent = JSON.stringify({
            storeMapping: storeData,
            jusoResult: result
        }, null, 2);
    }

    function setValue(id, value) {
        document.getElementById(id).value = value || "";
    }

    function escapeHtml(value) {
        return value
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }
</script>
</body>
</html>
