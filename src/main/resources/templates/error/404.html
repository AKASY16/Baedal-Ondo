<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 - 배달온도</title>
    <link rel="icon" href="/images/baedal-ondo-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/baedal-ui.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-page">

<header class="bo-topbar">
    <a class="bo-brand" href="/" aria-label="배달온도 홈">
        <img src="/images/baedal-ondo-icon.svg" alt="">
        <span class="bo-brand-copy">
            <span class="bo-brand-name">배달온도</span>
            <span class="bo-brand-description">오늘의 배달 수요 판단 도구</span>
        </span>
    </a>
    <span class="bo-topbar-note">404 NOT FOUND</span>
</header>

<main class="error-shell">
    <p class="error-code">404 · PAGE NOT FOUND</p>
    <h1 class="error-title">요청하신 페이지를 찾을 수 없습니다</h1>
    <p class="error-description">
        주소가 잘못 입력되었거나, 페이지가 이동 또는 삭제되었을 수 있습니다.
        아래 버튼으로 대시보드에 돌아가 현재 배달온도를 확인해 보세요.
    </p>

    <div class="error-actions">
        <a class="error-button" href="/">대시보드로 이동</a>
        <a class="error-button-secondary" href="/guest">지역으로 둘러보기</a>
    </div>
</main>

</body>
</html>
