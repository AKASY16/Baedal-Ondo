<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일시적인 오류 - 배달온도</title>
    <link rel="icon" href="/images/baedal-ondo-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/baedal-ui.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-page">

<header class="bo-topbar">
    <a class="bo-brand" href="/" aria-label="배달온도 홈">
        <img src="/images/baedal-ondo-icon.svg" alt="">
        <span class="bo-brand-copy">
            <span class="bo-brand-name">배달온도</span>
            <span class="bo-brand-description">오늘의 배달 수요 판단 도구</span>
        </span>
    </a>
    <span class="bo-topbar-note">SERVICE ERROR</span>
</header>

<main class="error-shell">
    <p class="error-code">500 · INTERNAL ERROR</p>
    <h1 class="error-title">일시적인 오류가 발생했습니다</h1>
    <p class="error-description">
        요청을 처리하는 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.
        같은 문제가 반복되면 문의해 주시면 확인하겠습니다.
    </p>

    <p class="error-hint">
        배달온도는 기상청, 에어코리아 등 외부 데이터를 함께 사용합니다.
        외부 제공처 상황에 따라 일부 정보를 일시적으로 불러오지 못할 수 있습니다.
    </p>

    <div class="error-actions">
        <a class="error-button" href="/">대시보드로 이동</a>
        <a class="error-button-secondary" href="/guest">지역으로 둘러보기</a>
    </div>
</main>

</body>
</html>
