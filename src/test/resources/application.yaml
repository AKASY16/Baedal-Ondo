# 테스트 전용 설정.
#
# 테스트 클래스패스가 우선하므로 이 파일이 main의 application.yaml을 대체한다.
# 개인 환경변수나 application-secret.yaml 없이 ./gradlew test 가 통과해야 한다.
# 다만 DB는 Testcontainers로 실제 MySQL을 띄우므로 Docker는 켜져 있어야 한다.
#
# 여기서는 application-secret.yaml을 import 하지 않는다.
# 로컬에 실제 키가 있어도 테스트가 외부 API를 호출하지 않도록 격리한다.

spring:
  # datasource는 MySqlTestSupport가 Testcontainers 컨테이너 정보로 주입한다.

  # 운영과 같은 방식으로 스키마를 만든다.
  # 마이그레이션이 실제로 실행되고, 엔티티 매핑이 그 스키마와 맞는지 validate가 검사한다.
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # 운영과 같은 값을 써야 페이지 렌더링 문제가 테스트에서 드러난다.
  # 자세한 사유는 main의 application.yaml 참고.
  thymeleaf:
    servlet:
      produce-partial-output-while-processing: false

logging:
  level:
    org.hibernate.SQL: warn

# 외부 API 키는 컨텍스트 기동에만 필요한 더미 값이다.
# base-url은 localhost로 두어 실수로 호출이 나가면 실제 API 대신 즉시 실패하게 한다.
kma:
  api:
    base-url: http://localhost:0/kma
    auth-key: test-kma-auth-key

dataportal:
  api:
    base-url: http://localhost:0/airkorea
    air-quality-stats-base-url: http://localhost:0/airkorea-stats
    holiday-base-url: http://localhost:0/holiday
    auth-key: test-dataportal-auth-key

jusogokr:
  api:
    search-base-url: http://localhost:0/juso-search
    coordinate-auth-key: test-juso-coordinate-key
    popup-auth-key: TESTJUSOGOKR

# 컨텍스트가 뜰 때 외부 API를 호출하지 않는다.
baedalondo:
  startup-preload:
    enabled: false

service:
  legal:
    operator-name: 배달온도 운영자
    contact-email: test@example.com
