# 앱과 MySQL을 함께 띄운다.
#
# 실행 전에 jar가 있어야 한다.
#   ./gradlew build
#
# 실행
#   docker compose up --build
#
# 키와 비밀번호는 .env에서 읽는다. .env는 저장소에 올리지 않는다.

services:
  db:
    image: mysql:8.0
    # 컨테이너 시계를 한국 시간으로 맞춰 로그를 읽기 쉽게 한다.
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: baedalondo
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 이 볼륨이 없으면 컨테이너를 지울 때 회원과 매장 데이터가 함께 사라진다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 앱이 Flyway 마이그레이션을 시작하기 전에 MySQL이 실제로 응답해야 한다.
      # 컨테이너가 떴다는 것과 접속을 받을 준비가 됐다는 것은 다르다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    environment:
      TZ: Asia/Seoul
      # 컨테이너 안에서 localhost는 자기 자신이다.
      # compose가 서비스 이름으로 내부 DNS를 만들어 주므로 db로 접속한다.
      DB_URL: jdbc:mysql://db:3306/baedalondo
      # 비워 두면 운영 기본값으로 뜬다. SQL 로그를 보려면 .env에 local을 넣는다.
      # 서버에서는 채우지 않는다. 이 compose를 서버로 가져갈 때 값이 따라가지 않도록
      # 기본값을 빈 문자열로 둔다.
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-}"
      # .env를 env_file로 통째로 넘기지 않는다. 그렇게 하면 앱이 쓰지도 않는
      # DB_ROOT_PASSWORD까지 컨테이너 환경변수로 들어가, 앱이 뚫렸을 때
      # DB 최고권한 비밀번호가 env 한 번으로 노출된다.
      # 값 자체는 compose가 .env에서 읽어 채운다.
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KMA_AUTH_KEY: ${KMA_AUTH_KEY}
      DATAPORTAL_AUTH_KEY: ${DATAPORTAL_AUTH_KEY}
      DATAPORTAL_HOLIDAY_AUTH_KEY: ${DATAPORTAL_HOLIDAY_AUTH_KEY}
      JUSO_COORDINATE_AUTH_KEY: ${JUSO_COORDINATE_AUTH_KEY}
      JUSO_POPUP_AUTH_KEY: ${JUSO_POPUP_AUTH_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
