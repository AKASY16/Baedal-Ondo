# 앱과 MySQL을 함께 띄운다.
#
# 실행 전에 jar가 있어야 한다.
#   ./gradlew build
#
# 실행
#   docker compose up --build
#
# 키와 비밀번호는 .env에서 읽는다. .env는 저장소에 올리지 않는다.

services:
  db:
    image: mysql:8.0
    # 컨테이너 시계를 한국 시간으로 맞춰 로그를 읽기 쉽게 한다.
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: baedalondo
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 이 볼륨이 없으면 컨테이너를 지울 때 회원과 매장 데이터가 함께 사라진다.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 앱이 Flyway 마이그레이션을 시작하기 전에 MySQL이 실제로 응답해야 한다.
      # 컨테이너가 떴다는 것과 접속을 받을 준비가 됐다는 것은 다르다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    environment:
      TZ: Asia/Seoul
      # 컨테이너 안에서 localhost는 자기 자신이다.
      # compose가 서비스 이름으로 내부 DNS를 만들어 주므로 db로 접속한다.
      DB_URL: jdbc:mysql://db:3306/baedalondo
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
